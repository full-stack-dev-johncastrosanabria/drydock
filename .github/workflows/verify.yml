name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-22.04        # ubuntu-latest (26.04) no ofrece Python 3.9
    strategy:
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: ./verify.sh
